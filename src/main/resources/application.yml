spring:
  application:
    name: lemon-app
    version: 1.0.0-BETA

mqtt:
  broker-uri: tcp://${IP}:1883
  topic-sensor-data: esp32/dht/sensor/data
  topic-sensor-anomalies: esp32/dht/sensor/anomalies
  client-id: ${CLIENT_ID:lemon-app-client}
  username: ${MQTT_USERNAME:esp32-gateway}
  password: ${MQTT_PASSWORD}
  qos: ${QOS:1}

validation:
  humidity-min: ${HUMIDITY_MIN:0}
  humidity-max: ${HUMIDITY_MAX:100}
  temperature-c-min: ${TEMPERATURE_MIN:-100}
  temperature-c-max: ${TEMPERATURE_MAX:100}

gcp:
  project-id: ${GCP_PROJECT_ID:lemon-app}
  instance-id: ${GCP_INSTANCE_ID:lemon-table}
  table-id: ${GCP_TABLE_ID:dht-sensor}
  column-family-temp-c: ${GCP_COLUMN_FAMILY:temp_c}
  column-family-hum: ${GCP_COLUMN_FAMILY:hum}
  admin-credentials-path: ${GCP_ADMIN_CREDENTIALS_PATH:}

sliding-window:
  window-size: ${SLIDING_WINDOW_SIZE:10}
  sigma: ${SLIDING_WINDOW_SIGMA:2.0}
  min-bounds: ${SLIDING_WINDOW_MIN_BOUNDS:1.0}
